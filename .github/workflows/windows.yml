```yaml
name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      npm_config_audit: "false"
      npm_config_fund: "false"

    defaults:
      run:
        working-directory: ./day098

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('day098/package-lock.json') }}

      - name: Verify project files
        shell: pwsh
        run: |
          if (!(Test-Path package.json)) {
            throw "package.json not found in the day098 project directory."
          }
          Write-Host "Project directory verified."

      - name: Install dependencies
        timeout-minutes: 10
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        shell: pwsh
        run: |
          Remove-Item package-lock.json -ErrorAction SilentlyContinue
          npm install --no-audit --no-fund --fetch-retries=5 --fetch-timeout=60000

      - name: Build web application
        run: npm run build

      - name: Build Windows executable
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayZero-Windows-Setup
          path: day098/release/*.exe
          if-no-files-found: error
```
